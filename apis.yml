aid: jones
name: Jones
description: >-
  Jones is a full-service SaaS platform purpose-built for insurance compliance
  in construction and commercial real estate, unifying Certificate of Insurance
  (COI) collection, deep insurance auditing, workflow automation, and a licensed
  brokerage in one platform. It pairs hundreds of insurance specialists with AI
  agents to review COIs and policies at enterprise scale, and is used by general
  contractors, construction managers, owner-operators, REITs, property
  management teams, and insurance brokers to manage compliance across large
  portfolios of subcontractors, vendors, and tenants. Jones offers two
  engagement models: Jones Software (self-managed) and Jones Operator (an
  AI-driven concierge that runs day-to-day insurance tasks). Reported scale:
  40,000+ projects, 3 billion+ square feet, and 50 million+ insurance documents
  processed for 300+ industry leaders. Headquartered in New York, NY, Jones was
  surfaced as a portfolio company of 500 Global and Foundry Group.
